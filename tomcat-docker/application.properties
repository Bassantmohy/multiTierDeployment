#JDBC Configutation for Database Connection
jdbc.driverClassName=com.mysql.jdbc.Driver
jdbc.url=jdbc:mysql://app-db:3306/accounts?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull
jdbc.username=root
jdbc.password=db-pass

#Memcached Configuration For Active and StandBy Host
#For Active Host
memcached.active.host=app-memcache
memcached.active.port=11211
#For StandBy Host
memcached.standBy.host=app-memcache
memcached.standBy.port=11211

#RabbitMq Configuration
rabbitmq.address=app-rmq
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest

#Elasticesearch Configuration
elasticsearch.host =192.168.1.85
elasticsearch.port =9300
elasticsearch.cluster=vprofile
elasticsearch.node=vprofilenode